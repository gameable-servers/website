```html
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Gameable — Game Server Hosting</title>
    <meta name="description" content="Gameable hosts and manages game servers for communities and players.">
    <meta name="theme-color" content="#15151b">

    <link rel="icon" href="/logo.png">

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        :root {
            --bg: #0d0d11;
            --surface: #141419;
            --surface-2: #1a1a21;
            --border: #292930;
            --text: #f4f4f5;
            --muted: #a1a1aa;
            --purple: #7657ff;
            --purple-hover: #876cff;
            --green: #42d392;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            font-family:
                Inter,
                ui-sans-serif,
                system-ui,
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                sans-serif;
            background: var(--bg);
            color: var(--text);
            line-height: 1.6;
        }

        a {
            color: inherit;
            text-decoration: none;
        }

        .container {
            width: min(1120px, calc(100% - 40px));
            margin: auto;
        }

        /* NAV */

        nav {
            height: 76px;
            border-bottom: 1px solid var(--border);
            background: rgba(13, 13, 17, 0.9);
            backdrop-filter: blur(12px);
            position: sticky;
            top: 0;
            z-index: 50;
        }

        .nav-inner {
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 11px;
            font-weight: 800;
            font-size: 19px;
            letter-spacing: -0.4px;
        }

        .brand img {
            width: 38px;
            height: 38px;
            border-radius: 9px;
            object-fit: cover;
        }

        .nav-links {
            display: flex;
            align-items: center;
            gap: 27px;
            color: var(--muted);
            font-size: 14px;
        }

        .nav-links a:hover {
            color: white;
        }

        .nav-discord {
            background: #5865f2;
            color: white !important;
            padding: 9px 15px;
            border-radius: 8px;
            font-weight: 700;
        }

        /* HERO */

        .hero {
            padding: 105px 0 90px;
            border-bottom: 1px solid var(--border);
        }

        .hero-grid {
            display: grid;
            grid-template-columns: 1.25fr .75fr;
            gap: 70px;
            align-items: center;
        }

        .eyebrow {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            border: 1px solid var(--border);
            background: var(--surface);
            padding: 7px 11px;
            border-radius: 999px;
            color: #c4c4cc;
            font-size: 12px;
            font-weight: 700;
            margin-bottom: 22px;
        }

        .dot {
            width: 7px;
            height: 7px;
            background: var(--green);
            border-radius: 50%;
            box-shadow: 0 0 10px rgba(66, 211, 146, .6);
        }

        h1 {
            font-size: clamp(48px, 7vw, 78px);
            line-height: .98;
            letter-spacing: -4px;
            max-width: 760px;
        }

        h1 span {
            color: var(--purple);
        }

        .hero p {
            color: var(--muted);
            font-size: 18px;
            max-width: 610px;
            margin-top: 25px;
        }

        .buttons {
            display: flex;
            gap: 12px;
            margin-top: 32px;
            flex-wrap: wrap;
        }

        .button {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            min-height: 45px;
            padding: 0 19px;
            border-radius: 9px;
            border: 1px solid var(--border);
            font-weight: 750;
            font-size: 14px;
            transition: .18s ease;
        }

        .button.primary {
            background: var(--purple);
            border-color: var(--purple);
        }

        .button.primary:hover {
            background: var(--purple-hover);
            transform: translateY(-1px);
        }

        .button.secondary:hover {
            background: var(--surface-2);
        }

        /* SERVER CARD */

        .server-card {
            border: 1px solid var(--border);
            background: var(--surface);
            border-radius: 15px;
            padding: 21px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, .25);
        }

        .server-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-bottom: 18px;
            border-bottom: 1px solid var(--border);
        }

        .server-name {
            font-weight: 800;
        }

        .online {
            display: flex;
            align-items: center;
            gap: 6px;
            color: var(--green);
            font-size: 12px;
            font-weight: 700;
        }

        .online .dot {
            width: 6px;
            height: 6px;
        }

        .server-game {
            color: var(--muted);
            font-size: 13px;
            margin-top: 4px;
        }

        .server-info {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-top: 18px;
        }

        .stat {
            background: var(--surface-2);
            border: 1px solid var(--border);
            border-radius: 9px;
            padding: 12px;
        }

        .stat small {
            display: block;
            color: var(--muted);
            font-size: 11px;
            margin-bottom: 3px;
        }

        .stat strong {
            font-size: 14px;
        }

        /* SECTIONS */

        section {
            padding: 90px 0;
        }

        .section-heading {
            margin-bottom: 35px;
        }

        .section-heading h2 {
            font-size: 34px;
            letter-spacing: -1.5px;
        }
```
